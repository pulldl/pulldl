<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PullDL Quick Launcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-symbol">◈</span>
        <span class="brand-text">PullDL</span>
      </div>
      <button id="btn-popup-settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <!-- Current Tab Status Card -->
    <div class="site-card">
      <div class="site-info">
        <span class="site-icon">🌐</span>
        <span class="site-domain" id="site-domain-label">Scanning page...</span>
      </div>
      <div class="site-status">
        <span class="status-dot" id="site-status-dot"></span>
        <span class="status-text" id="site-status-text">Detecting media</span>
      </div>
    </div>

    <!-- Flagship Primary Action -->
    <div class="primary-actions">
      <button id="btn-open-sidepanel" class="btn-primary-command">
        <span class="btn-symbol">◈</span>
        <span>Open Download Center</span>
        <span class="btn-shortcut">Side Panel</span>
      </button>

      <div class="action-grid">
        <button id="btn-download-best" class="btn-secondary" title="Download highest quality detected stream">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span id="label-download-best">Download Best</span>
        </button>
        <button id="btn-detect-media" class="btn-secondary" title="Re-scan current tab for media">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Detect Media</span>
        </button>
      </div>
    </div>

    <!-- Quick URL Input -->
    <div class="quick-input-group">
      <input type="text" id="quick-url-input" placeholder="Paste URL to analyze..." class="quick-input" autocomplete="off" spellcheck="false">
      <button id="btn-analyze-url" class="btn-analyze">Analyze</button>
    </div>

    <!-- Recent Items Snippet -->
    <div class="recent-section">
      <div class="section-title">Recent Activity</div>
      <div id="recent-list" class="recent-list">
        <div class="recent-empty">No downloads yet. Active tasks appear here.</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-links">
        <button class="footer-link" id="link-open-history">History</button>
        <span class="separator">•</span>
        <button class="footer-link" id="link-open-settings">Settings</button>
        <span class="separator">•</span>
        <a href="https://pulldl.com" target="_blank" class="footer-link">Web Studio ↗</a>
      </div>
      <span class="shortcut-hint">⌘K Command Palette</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
